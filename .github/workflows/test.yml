# GeoNode Client 5.x CI (tests)
#
# Runs lint and Karma in separate jobs so that a lint regression cannot
# block the unit-test merge gate. Lint is scoped to js/plugins/hydrata/* —
# upstream MapStore2 / GeoNode-stock code is intentionally excluded to avoid
# manufacturing merge conflicts on every upstream sync.

name: GeoNode Client 5.x CI (tests)

on:
  pull_request:
    branches: [ 5.x ]
    paths:
      - "geonode_mapstore_client/client/**"

  push:
    branches: [ 5.x ]
    paths:
      - "geonode_mapstore_client/client/**"

  workflow_dispatch:

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    env:
      working-directory: ./geonode_mapstore_client/client
    steps:
      - name: "Checking out"
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: "Setting up npm"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Cache node modules"
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: "Run npm install"
        run: npm install
        working-directory: ${{ env.working-directory }}

      - name: "Run ESLint"
        run: npm run lint
        working-directory: ${{ env.working-directory }}

  test:
    name: Karma unit tests
    runs-on: ubuntu-latest
    env:
      working-directory: ./geonode_mapstore_client/client
      # ChromeHeadless on the GitHub-hosted ubuntu-24.04 runner needs the
      # sandbox flags; otherwise --disable-dev-shm-usage prevents the
      # /dev/shm exhaustion that triggers the karma-chrome-launcher 3.1.1
      # disconnect bug under load.
      CHROME_BIN: /usr/bin/google-chrome
      CHROMIUM_FLAGS: "--no-sandbox --disable-dev-shm-usage --headless=new"
    steps:
      - name: "Checking out"
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: "Setting up npm"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Cache node modules (npm)"
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('geonode_mapstore_client/client/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: "Cache karma-webpack"
        uses: actions/cache@v4
        with:
          path: geonode_mapstore_client/client/node_modules/.cache/karma-webpack
          key: ${{ runner.os }}-karma-webpack-${{ hashFiles('geonode_mapstore_client/client/karma.conf.single-run.js', 'geonode_mapstore_client/client/package.json', 'geonode_mapstore_client/client/MapStore2/build/babel.config.js') }}
          restore-keys: |
            ${{ runner.os }}-karma-webpack-

      - name: "Run npm install"
        run: npm install
        working-directory: ${{ env.working-directory }}

      - name: "Run Unit Tests"
        run: npm test
        working-directory: ${{ env.working-directory }}
