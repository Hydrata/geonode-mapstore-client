# GeoNode Client 5.x CI (tests)
#
# Runs lint and Karma in separate jobs so that a lint regression cannot
# block the unit-test merge gate. Lint is scoped to js/plugins/hydrata/* —
# upstream MapStore2 / GeoNode-stock code is intentionally excluded to avoid
# manufacturing merge conflicts on every upstream sync.

name: GeoNode Client 5.x CI (tests)

on:
  # No paths: filter on pull_request — required checks must always report on PRs; a path-filtered required check leaves non-matching PRs blocked forever (TASK-2297 review).
  pull_request:
    branches: [ 5.x ]

  push:
    branches: [ 5.x ]
    paths:
      - "geonode_mapstore_client/client/**"

  workflow_dispatch:

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    env:
      working-directory: ./geonode_mapstore_client/client
    steps:
      - name: "Checking out"
        uses: actions/checkout@v4
      - name: Checkout submodules (shallow)
        run: git submodule update --init --recursive --depth=1

      - name: "Setting up npm"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Cache node modules"
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: "Run npm install"
        run: npm install
        working-directory: ${{ env.working-directory }}

      - name: "Run ESLint"
        run: npm run lint
        working-directory: ${{ env.working-directory }}

  css-namespace-guard:
    name: CSS namespace guard
    # Independent of ESLint — required even while ESLint is being greened.
    # Runs in ~1s (pure Node, no npm install needed — uses only built-ins).
    runs-on: ubuntu-latest
    steps:
      - name: "Checking out"
        uses: actions/checkout@v4

      - name: "Setting up Node"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Run CSS namespace guard"
        run: node js/plugins/hydrata/SimpleView/css-namespace-guard.js
        working-directory: ./geonode_mapstore_client/client

  paywall-css-coverage-guard:
    name: Paywall CSS coverage guard
    # TASK-2437 (epic 2425 W2), extended by the W2 remediation pass.
    #
    # WHAT IT ACTUALLY CHECKS — two static checks over the stylesheet SOURCES:
    #   1. Every paywall-/compute-meter-/sv-anuga-scenario-estimate- className
    #      emitted by those components has SOME matching rule somewhere
    #      (or a justified ALLOWLIST entry).
    #   2. No such className is reachable ONLY through an ancestor selector:
    #      if every rule covering it sits under, say, .sv-account-billing-tab,
    #      the guard fails until that is declared in ANCESTOR_SCOPED with the
    #      ancestor named and a reason. Check 2 exists because check 1 alone
    #      was proven bypassable — re-scoping all 23 meter.css rules to
    #      ".sv-account-billing-tab .compute-meter-*", byte-for-byte the
    #      production defect shape, still exited 0.
    #
    # TWO BOUNDARIES — do not overstate this job:
    #   (a) IT IS NOT A MERGE BLOCKER. It is not in ruleset 19084444's required
    #       status checks, so a PR that (for example) deletes meter.css turns
    #       this job red and stays MERGEABLE. Making it required is an
    #       operator-gated ruleset change, tracked separately.
    #   (b) IT CANNOT SEE THE RUNTIME CASCADE. Both checks read source text.
    #       "A rule exists, and is not ancestor-locked" is not "this rule
    #       applies at this component's mount point" — that needs a real render
    #       tree and a layout engine. Karma cannot answer it either (jsdom has
    #       neither). Only tests/e2e/test_paywall_money_path.py in the deploy
    #       repo can, and it is the authority whenever the two disagree.
    #
    # Separate job for the same reason as the guard above: it must stay
    # independent of ESLint, and it runs in ~1s on Node built-ins with no
    # npm install.
    runs-on: ubuntu-latest
    steps:
      - name: "Checking out"
        uses: actions/checkout@v4

      - name: "Setting up Node"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Run paywall CSS coverage guard"
        run: node js/plugins/hydrata/Paywall/paywall-css-coverage-guard.js
        working-directory: ./geonode_mapstore_client/client

  test:
    name: Karma unit tests
    runs-on: ubuntu-latest
    env:
      working-directory: ./geonode_mapstore_client/client
      # ChromeHeadless on the GitHub-hosted ubuntu-24.04 runner needs the
      # sandbox flags; otherwise --disable-dev-shm-usage prevents the
      # /dev/shm exhaustion that triggers the karma-chrome-launcher 3.1.1
      # disconnect bug under load.
      CHROME_BIN: /usr/bin/google-chrome
      CHROMIUM_FLAGS: "--no-sandbox --disable-dev-shm-usage --headless=new"
    steps:
      - name: "Checking out"
        uses: actions/checkout@v4
      - name: Checkout submodules (shallow)
        run: git submodule update --init --recursive --depth=1

      - name: "Setting up npm"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Cache node modules (npm)"
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('geonode_mapstore_client/client/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: "Cache karma-webpack"
        uses: actions/cache@v4
        with:
          path: geonode_mapstore_client/client/node_modules/.cache/karma-webpack
          key: ${{ runner.os }}-karma-webpack-${{ hashFiles('geonode_mapstore_client/client/karma.conf.single-run.js', 'geonode_mapstore_client/client/package.json', 'geonode_mapstore_client/client/MapStore2/build/babel.config.js') }}
          restore-keys: |
            ${{ runner.os }}-karma-webpack-

      - name: "Run npm install"
        run: npm install
        working-directory: ${{ env.working-directory }}

      - name: "Run Unit Tests"
        run: npm test
        working-directory: ${{ env.working-directory }}
