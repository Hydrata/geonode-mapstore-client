{% load static %}

{% block extra_head %}
    <link href="{% static 'hydratabase/css/geonode-navbar-fixes.css' %}" rel="stylesheet"/>
    <link href="{% static 'nicp/css/nicp_base.css' %}" rel="stylesheet"/>
    <link href="{% static 'nicp/css/nicp_home.css' %}" rel="stylesheet"/>
    <meta property="og:title" content="Nicaragua Hydro Portal" />
    <meta property="og:description" content="A web portal for Nicaragua's hydrogeological data and knowledge" />
    <meta property="og:url" content="https://nicaraguahydroportal.com" />
{% endblock extra_head %}

<header class="gn-main-header nicp-dummy-class-header_nicp">
    {% include './navbar_nicp.html'  with id='gn-brand-navbar' %}
</header>

<div class="gn-main-header-placeholder"></div>
{% if show_hero %}
    {% include './hero_nicp.html' %}
{% endif %}

{#{% include './topbar.html' with id='gn-topbar' %}#}

<script>
    (function () {
        const mainHeader = document.querySelector('.gn-main-header');
        const mainHeaderPlaceholder = document.querySelector('.gn-main-header-placeholder');
        const topbar = document.querySelector('#gn-topbar');
        function resize() {
            if (mainHeaderPlaceholder && mainHeader) {
                mainHeaderPlaceholder.style.height = mainHeader.clientHeight + 'px';
            }
            if (topbar && mainHeader) {
                topbar.style.top = mainHeader.clientHeight + 'px';
            }
        }
        window.addEventListener('resize', resize);
        window.addEventListener('DOMContentLoaded', resize);
        resize();
    })();
</script>
