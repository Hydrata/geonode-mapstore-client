<style>
    /*
     * TASK-673 D1.7 (B5 S4): pre-reserve viewport-minus-header height for the
     * loader container so the spinner-to-React-tree swap doesn't trigger CLS.
     * Cold-anon CLS was 0.90 (BAD per Web Vitals); the shift fired at ~+5031ms
     * when the React tree mounted with a ~vh-sized layout while the loader had
     * been sitting at ~auto height.
     *
     * Scoped to map routes only: on the homepage / catalogue, the React tree
     * may render an empty (display:none) ResourcesGrid when a site has no
     * featured resources, leaving #ms-container vh-tall and blank. The CLS
     * issue was specific to /catalogue/#/map/<id>, so the gn-on-map-route
     * class (set pre-paint by the script below) bounds the rule there.
     *
     * 56px is the gn-main-header default; the JS-driven .gn-main-header-placeholder
     * adjusts at runtime if a larger navbar renders. Using calc(100vh - 56px) as
     * the floor is conservative — the React tree typically requests a similar
     * footprint, so no observable layout movement when it mounts.
     */
    html.gn-on-map-route #ms-container {
        min-height: calc(100vh - 56px);
        position: relative;
    }
    #ms-container {
        position: relative;
    }
    .gn-main-event-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        flex-direction: column;
    }
    .gn-main-event-content {
        position: relative;
        font-size: inherit;
    }
    .gn-main-loader {
        border-radius: 50%;
        width: 12em;
        height: 12em;
        box-sizing: border-box;
        border: 1em solid rgba(119,119,119, 0.2);
        border-left: 1em solid #777777;
        -webkit-animation: gn-main-loader-animation 1.1s infinite linear;
        animation: gn-main-loader-animation 1.1s infinite linear;
    }
    .gn-main-event-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.5em;
        text-align: center;
        font-family: 'Montserrat', sans-serif;
    }
    @-webkit-keyframes gn-main-loader-animation {
        0% {
            -webkit-transform: rotate(0deg);
            transform: rotate(0deg);
        }
        100% {
            -webkit-transform: rotate(360deg);
            transform: rotate(360deg);
        }
    }
    @keyframes gn-main-loader-animation {
        0% {
            -webkit-transform: rotate(0deg);
            transform: rotate(0deg);
        }
        100% {
            -webkit-transform: rotate(360deg);
            transform: rotate(360deg);
        }
    }
    /*
     * TASK-673 D1.7 (B5 S4): when arriving at a /catalogue/#/map/<id> URL the
     * footer was visible at first paint, then hidden at DOMContentLoaded by
     * the toggleFooterOnMap script at the bottom of catalogue.html — that
     * second-stage hide caused the React tree to shift up by the footer height.
     * Pre-hiding via :has() at parse time eliminates the shift. The 2s-delayed
     * fallback in catalogue.html still runs (covers older browsers that don't
     * yet apply :has() to root attributes set by the script below).
     */
    html.gn-on-map-route .gn-footer {
        display: none !important;
    }
</style>
<script>
    /*
     * TASK-673 D1.7 (B5 S4): set a root class BEFORE first paint based on the
     * URL hash so the .gn-footer hide rule above applies before any layout pass.
     * Mirror of the toggleFooterOnMap function in catalogue.html — keep in sync.
     */
    (function () {
        try {
            var isMapRoute = (window.location.hash || '').match(/^#\/map\//);
            if (isMapRoute) {
                document.documentElement.classList.add('gn-on-map-route');
            }
            window.addEventListener('hashchange', function () {
                var onMap = (window.location.hash || '').match(/^#\/map\//);
                document.documentElement.classList.toggle('gn-on-map-route', !!onMap);
            });
        } catch (e) {}
    })();
</script>
