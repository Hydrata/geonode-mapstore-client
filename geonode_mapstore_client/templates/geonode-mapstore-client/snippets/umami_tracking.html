<script>
(function() {
    var seen = {};
    // TASK-2139: stable 'js-error' label (was a truncated 50-char message —
    // unbounded cardinality, no route). Real detail (message/stack-head/route)
    // now rides in the umami.track DATA object instead of the label, so the
    // Umami dashboard groups every FE error under one event type and the
    // per-occurrence detail stays queryable via event data.
    function trackError(msg, source, line, stack) {
        if (typeof umami === 'undefined') return;
        // TASK-1806(b): Skip the OpenReplay canvas-capture SecurityError (~16/wk).
        // OpenReplay tries toBlob() on the OpenLayers/WebGL map canvas which is
        // cross-origin-tainted; the browser fires a SecurityError that window.onerror
        // catches here. The session still records — only the canvas snapshot fails.
        var msgStr = String(msg);
        if (msgStr.indexOf('SecurityError') !== -1 && msgStr.indexOf('toBlob') !== -1) {
            return;
        }
        var key = msg + (source || '') + (line || '');
        if (seen[key]) return;
        seen[key] = true;
        var route = window.location.pathname + (window.location.hash || '');
        umami.track('js-error', {
            category: 'js-error',
            message: msgStr.substring(0, 200),
            stack: stack ? String(stack).substring(0, 200) : '',
            source: source ? source.split('/').pop().split('?')[0] : '',
            line: line || '',
            route: route
        });
    }
    window.addEventListener('error', function(e) {
        trackError(e.message || e.error || 'Unknown error', e.filename, e.lineno, e.error && e.error.stack);
    });
    window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason;
        var msg = reason instanceof Error ? reason.message : String(reason);
        var stack = reason instanceof Error ? reason.stack : '';
        // Object-shaped rejections used to collapse to the zero-information
        // 'Unhandled rejection (object)' string. The stable label + the real
        // reason (message/stack when available, else a best-effort JSON dump
        // capped at 200 chars) now carries actual signal in the data object.
        if (msg === '[object Object]') {
            try {
                msg = 'Unhandled rejection (object): ' + JSON.stringify(reason).substring(0, 160);
            } catch (e2) {
                msg = 'Unhandled rejection (object)';
            }
        }
        trackError(msg, '', '', stack);
    });
})();
</script>
{% if request.user.is_authenticated %}
<script>
(function waitForUmami() {
    if (typeof umami !== 'undefined') {
        // TASK-2139: STRING-first form so Umami populates distinctId (the
        // object-only form `umami.identify({username})` stores the payload as
        // unqueryable session data and distinctId never populates — the
        // forensics bug). user_id rides in the data object alongside.
        umami.identify('{{ request.user.username }}', { user_id: {{ request.user.id }} });
    } else {
        setTimeout(waitForUmami, 500);
    }
})();
</script>
{% endif %}
